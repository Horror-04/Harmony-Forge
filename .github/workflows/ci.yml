# Sprint 4 CI: configure (BUILD_PLUGIN=ON) + build + ctest + pluginval VST3 check.
# Every step below mirrors a command run locally during Sprint 4.
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    # The enforce gates (torch-free, seconds, no build): fail fast before
    # configure/build/test. Four families, all blocking:
    #  * architecture/isolation — banned tokens on the audio path, the
    #    layer includes, the golden pin, the golden-manifest registry, the
    #    invariant tags, the sealed-split isolation;
    #  * companion behaviour — the FL dispatcher's pure path (stdlib
    #    unittest, seconds, no FL Studio on the runner);
    #  * quality/size ratchets (S10.1) — file size, UTF-8 encoding, the
    #    CCN ratchet and the off-golden literal census. These ARE style/
    #    quality gates: they are static, fast and blocking, and every
    #    counter, exception and reason behind them is recorded in
    #    docs/measurements/ratchet.md;
    #  * python test suites — the gates' OWN test suites: the torch-free
    #    subset of tools/tests/ under pytest (the training-venv/torch/onnx
    #    dependent files are excluded BY NAME) plus the two stdlib-unittest
    #    steps (the FL dispatcher, the JUCE build-support gate). A
    #    regression in a lint's own suite now fails the job.
    #
    # "torch-free" means: stdlib + the pinned pytest + the pinned lizard.
    # The runner never gets torch, onnx or onnxruntime (no training venv).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the golden-manifest lint checks that every
          # record's `commit` names a commit that RESOLVES in this
          # repository. A shallow clone (default fetch-depth: 1) cannot
          # resolve it, so the check would be skipped in CI.
          fetch-depth: 0

      - name: Layer gate (src/core JUCE-free, inference plugin-free)
        run: python tools/check_layers.py --strict

      - name: JUCE build-support gate (the build INPUTS are TRACKED)
        # Stdlib only, seconds, no build. The JUCE CMake/build-tool
        # support tree (JUCE/extras/Build, 47 files) is a build INPUT,
        # not a build output - but `.gitignore`'s `build*/` rule (git's
        # ignore matching is case-insensitive on Windows) swallowed it,
        # so it was never tracked and a fresh checkout could not
        # configure JUCE at all. The lint asserts the key inputs are
        # TRACKED in git (not merely present on disk), that the tracked
        # set equals the pinned upstream count, and that the tracked and
        # the on-disk sets agree. Blocking: non-zero fails the job.
        run: python tools/lint_juce_build_support.py

      - name: Locale-independence gate (no locale-decoded subprocess capture)
        # Stdlib only, seconds. `subprocess.run(..., text=True)` without
        # an explicit `encoding=` decodes the child's bytes with the
        # LOCALE - that crashed the first GitHub Actions run on the
        # cp1252 runner. The AST guard used to live only inside
        # tools/tests/test_git_locale_independence.py, where the CI
        # never executed it (the workflow has no pytest step); it now
        # lives in this script and the test calls the script's function
        # (one implementation, no duplicated logic). Blocking: non-zero
        # fails the job.
        run: python tools/lint_locale_independence.py

      - name: RT gate (no banned tokens in audio-path scope)
        run: python tools/rt_scan.py --strict

      - name: Golden pin lint (frozen bitmap pin, NEVER-REGENERATE)
        run: python tools/lint_golden_pin.py

      - name: "Golden manifest lint (checked registry: schema + sha + coverage)"
        # Stdlib only, seconds, no build: tests/golden_manifest.json must
        # stay a CHECKED registry. What the lint enforces:
        #  - every record carries kind/commit/produced_by/files, the kind
        #    matches its section, and the commit names a commit that
        #    RESOLVES in this repository (skipped, with a NOTE, when the
        #    resolution is unavailable - shallow clone / no git);
        #  - every recorded sha256 equals the file's canonical sha256
        #    (LF-normalized for text artifacts, raw for binary ones);
        #  - every produced_by uses one of two honest, prefix-required
        #    forms: `gen: <command>` (a tool of the lint's WRITER registry,
        #    bound to that exact artifact) or
        #    `capture: <source>@<commit> (no in-repo writer) - <pointer>`
        #    (pointer file + a quoted anchor that appears verbatim in it);
        #  - every file under tests/golden/** + tests/fixtures/** is
        #    registered by some record (except the tool's reasoned exclusion
        #    list), the named test files/cases still exist, and the
        #    golden_midi scalars match their file.
        # Blocking: non-zero fails the job, same shape as the pin lint.
        run: python tools/lint_golden_manifest.py

      - name: Invariant tag lint (named [inv1]-[inv5] bindings)
        # Stdlib only, seconds: every INVARIANTS.md-bound TEST_CASE carries
        # its [invN] tag (tools/lint_inv_tags.py, in-script map). Blocking:
        # non-zero fails the job, same shape as the golden pin lint.
        run: python tools/lint_inv_tags.py

      - name: Sealed-test isolation grep
        # No training/eval code may reference the sealed split. The only
        # legitimate references are the one-time producer
        # (training/ingest/carve_sealed.py: wrote the split at creation,
        # never scores) and the verifier (training/tests/test_sealed.py:
        # manifest cross-checks only). Anything else fails the job.
        run: |
          $hits = Get-ChildItem -Path training -Recurse -Filter *.py | Select-String -Pattern 'sealed_test' | Where-Object { $_.Path -notmatch 'carve_sealed\.py$' -and $_.Path -notmatch 'test_sealed\.py$' }
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'sealed-grep CLEAN: only carve_sealed.py + test_sealed.py reference sealed_test'

      - name: FL companion dispatcher test (pure path)
        # Stdlib only, seconds, no venv, no FL Studio: the companion's pure
        # surface (plan_layout + the dry-run path of
        # src/companion/fl_dispatcher.py) is pinned by
        # tools/tests/test_fl_dispatcher.py (stdlib unittest, the repo's
        # tools/tests convention). DISPATCHER-ONLY by decision D-B8 - but the
        # general python test step is NO LONGER "separate later work": it is
        # implemented BELOW as "Python gate tests (the torch-free subset of
        # tools/tests)", which runs every tools/tests file that needs no
        # training venv (the venv/torch/onnx-dependent ones are excluded BY
        # NAME there). The TRAINING suite (training/tests/) is still NOT run
        # in CI: it needs the training venv + torch, which the runner does
        # not have. Blocking: a failing test fails the job.
        run: python -m unittest discover -s tools/tests -p "test_fl_dispatcher.py" -v

      - name: CI-input gate unit test (JUCE build-support tracked)
        # Stdlib only, seconds, no venv, no build: the unit-level proof
        # for tools/lint_juce_build_support.py (the gate above). A
        # scratch git repo per case; the real tree is never modified.
        run: python -m unittest discover -s tools/tests -p "test_lint_juce_build_support.py" -v

      - name: File-size gate (no code file over 500 lines may appear/grow)
        # Stdlib only, seconds: tools/lint_file_size.py pins the 8 code
        # files that are over 500 lines today (tracked .h/.cpp/.py under
        # src/ tests/ tools/). The SET must not GROW (a new file over 500
        # lines fails) and a pinned file's line count must not GROW; a
        # shrunk pinned file is only reported (the owner prunes the list).
        # Line counting is python over the file BYTES — never
        # Measure-Object -Line (it counts non-empty lines only: it said
        # 975 for the 1046-line PluginEditor.cpp, see
        # docs/measurements/s9-0.md Appendix B).
        run: python tools/lint_file_size.py

      - name: UTF-8 gate (every tracked text file decodes as UTF-8)
        # Stdlib only, seconds: tools/lint_utf8.py checks every tracked
        # file except the vendored JUCE/ and external/ trees; a file with
        # a NUL byte is binary and is skipped. Two paths are allowlisted
        # (tools/score_sheet.md — CP1252 by an S0 decision, NEVER
        # re-encode; tests/fixtures/ref_bad_header.mid — a deliberately
        # corrupted MIDI fixture that must not be "fixed"). Blocking:
        # non-zero fails the job.
        run: python tools/lint_utf8.py

      - name: Install the pinned CCN analyzer (lizard 1.24.1)
        # The CCN ratchet measures with lizard 1.24.1 — the version this
        # repo measured with (docs/measurements/s3-0-ccn.md). The version
        # is PINNED on purpose: another lizard version moves the CCN
        # numbers and would silently re-baseline the ratchet.
        run: python -m pip install lizard==1.24.1

      - name: CCN ratchet gate (no new function over CCN 15; ceiling 20)
        # lizard + stdlib, seconds: tools/lint_ccn.py over src/. A new
        # function above CCN 15 fails (16..20 must be pinned with a
        # reason, >20 is the owner's hard ceiling); a pinned function's
        # CCN may not grow; a vanished pinned function is only reported.
        # --strict: a missing lizard fails the job instead of skipping.
        run: python tools/lint_ccn.py --strict

      - name: Off-golden literal census (hard-zero + per-file ratchet)
        # Stdlib only, seconds: tools/lint_off_golden.py. BLOCKING since
        # S10.1: digest64 and hex16+ must be 0 (hard-zero categories),
        # and the per-file counts of vectors/strings/assert>=1000/toler
        # and the TOTAL may not grow — a total-only ratchet would let
        # literals be moved between files. The pins and the audited
        # classification blocks live in tools/off_golden_ratchet.py
        # (16 assert entries, 15 MANUAL_PARITY entries, 43 per-file
        # lines); the record is docs/measurements/ratchet.md.
        run: python tools/lint_off_golden.py

      - name: Python gate tests (the torch-free subset of tools/tests)
        # Blocking. Until now CI ran ONE python test file (the FL
        # dispatcher, via stdlib unittest), so a regression in a lint's OWN
        # test suite was invisible until someone ran pytest locally. This
        # step runs the torch-free subset of tools/tests/ (121 of the 178
        # collected tests today). It sits AFTER the lizard install above, so
        # the CCN unit tests RUN here instead of skipping. Seconds, no
        # build, no venv.
        #
        # EXPLICITLY EXCLUDED - never silently dropped. These six files
        # drive the TRAINING stack (training/decode.py,
        # training/evaluate.py, tools/render_model.py,
        # tools/render_batch.py), which needs the training/.venv
        # interpreter: torch + onnx + onnxruntime (+ numpy), none of which
        # the runner has:
        #   test_expected_errors.py    - imports tools/render_model.py ->
        #                                `import onnx` (the FIRST missing
        #                                module) -> onnxruntime
        #   test_keynorm_ab.py        - the training stack -> torch + onnxruntime
        #   test_pressure_variants.py - the training stack -> torch + onnxruntime
        #   test_render_batch.py      - spawns tools/render_batch.py with the
        #                                running interpreter -> training/
        #                                evaluate.py -> onnxruntime
        #   test_render_model.py      - the training stack -> torch + onnxruntime
        #   test_step1_table.py       - the training stack -> torch + onnxruntime
        # The TRAINING suite (training/tests/) is NOT run in CI for the
        # same reason: it needs the training venv + torch, which the runner
        # does not have. The gates job stays TORCH-FREE: stdlib + the pinned
        # pytest + the pinned lizard - never torch/onnx/onnxruntime.
        #
        # MAINTAINER HINT: the --ignore= list below is EXPLICIT, so a NEW
        # torch/onnxruntime-dependent test file under tools/tests/ is NOT
        # silently skipped - pytest tries to COLLECT it, the import fails,
        # and the step exits non-zero with a collection error. That is
        # intentional: add the new file to the --ignore= list below (with
        # its reason) to make the step green again.
        run: |
          # pytest is PINNED exactly like lizard==1.24.1 (the repo's
          # reproducibility convention): an unpinned pytest would silently
          # re-baseline the suite's behaviour on the next release.
          # pytest 9.1.1 needs Python >= 3.10; the runner's python is 3.12.x.
          python -m pip install --disable-pip-version-check pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw "pip install pytest failed: exit $LASTEXITCODE" }
          $exclude = @(
            '--ignore=tools/tests/test_expected_errors.py',
            '--ignore=tools/tests/test_keynorm_ab.py',
            '--ignore=tools/tests/test_pressure_variants.py',
            '--ignore=tools/tests/test_render_batch.py',
            '--ignore=tools/tests/test_render_model.py',
            '--ignore=tools/tests/test_step1_table.py'
          )
          python -m pytest tools/tests -q @exclude
          if ($LASTEXITCODE -ne 0) { throw "the torch-free tools/tests subset FAILED: exit $LASTEXITCODE" }

  build-test-validate:
    needs: gates
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: sseed probe (real-TU compile witness)
        # B7 guard for the `sseed` initializer (docs/measurements/s3-quirks.md,
        # Status: CAUSE ESTABLISHED). The cause of the old `error C2059` is
        # KNOWN: the scratch mutations carried an extra closing paren - a
        # plain C++ syntax error, not a toolchain quirk. The probe compiles
        # the REAL site TU and asserts: the site compiles as it stands, the
        # well-formed one-line forms compile (lines joined, and an
        # inner-expression mutation on one line - the fact that retired the
        # old constraint), and each of the four recorded malformed forms
        # fails to compile.
        # It runs HERE, not in the `gates` job: it needs the MSVC toolchain
        # (which this job already requires for the build), while the gates
        # job stays stdlib-only. No build tree, no venv.
        # The verdicts fail the job on purpose: RETIRE (a well-formed
        # one-line form stopped compiling - the site or the toolchain broke,
        # so the retired constraint must be re-opened) and FAIL (a fact no
        # longer holds) must be noticed, never ignored.
        run: python tools/c2059_probe/probe_c2059.py --require-msvc

      - name: Vocab layout check (spec -> gen.h freshness + frozen pin)
        # Stdlib only, seconds: spec-bitmap == frozen d66faabf pin AND
        # committed vocab_layout.gen.h == generator output. Must run BEFORE
        # build so a stale/mismatched generated header fails fast.
        run: python tools/gen_vocab_layout.py --check

      - name: Golden pin lint (frozen bitmap pin, NEVER-REGENERATE)
        # Stdlib only, seconds: canonical bitmap sha == in-script d66faabf
        # pin (tools/lint_golden_pin.py) + manifest frozen/file cross-check.
        # Runs AFTER the vocab check (same gate family) and BEFORE build so
        # a tampered frozen golden fails fast. Blocking: non-zero fails job.
        run: python tools/lint_golden_pin.py

      - name: Invariant tag lint (named [inv1]-[inv5] bindings)
        # Stdlib only, seconds: every INVARIANTS.md-bound TEST_CASE carries
        # its [invN] tag (tools/lint_inv_tags.py). Runs AFTER the golden pin
        # (same gate family) and BEFORE build. Blocking: non-zero fails job.
        run: python tools/lint_inv_tags.py

      - name: Configure
        run: cmake -S . -B build -DHARMONY_FORGE_BUILD_PLUGIN=ON

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: S3 body-identity check (advisory)
        # S3 slice 1: exact-move guard for the candidates.cpp split
        # (tools/check_bodies.py, stdlib only, seconds). ADVISORY until the
        # split lands — never fail the job.
        continue-on-error: true
        run: python tools/check_bodies.py

      - name: Determinism proof (render_midi byte-identity)
        # NO `fc /b` here: in PowerShell `fc` is the built-in alias for
        # Format-Custom (NOT fc.exe), so the comparison did something
        # else entirely. Compare the sha256 of the two renders and THROW
        # on a mismatch - the same intent (byte-identity), a loud failure.
        run: |
          .\build\tools\Release\render_midi.exe --seed 7 --bars 4 --out ci_a.mid
          if ($LASTEXITCODE -ne 0) { throw "render_midi (ci_a.mid) failed: exit $LASTEXITCODE" }
          .\build\tools\Release\render_midi.exe --seed 7 --bars 4 --out ci_b.mid
          if ($LASTEXITCODE -ne 0) { throw "render_midi (ci_b.mid) failed: exit $LASTEXITCODE" }
          # EXPLICIT existence guard for BOTH renders: Get-FileHash on a
          # missing file only fails because the runner's pwsh sets
          # $ErrorActionPreference='stop' - a silent, unreadable reason.
          # The determinism proof must name the file that is missing.
          foreach ($f in @('ci_a.mid', 'ci_b.mid')) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "DETERMINISM FAIL: $f was not rendered (the file does not exist) - nothing to compare" }
          }
          $a = (Get-FileHash -Path ci_a.mid -Algorithm SHA256).Hash
          $b = (Get-FileHash -Path ci_b.mid -Algorithm SHA256).Hash
          Write-Host "ci_a.mid sha256 = $a"
          Write-Host "ci_b.mid sha256 = $b"
          if ($a -ne $b) { throw "DETERMINISM FAIL: ci_a.mid ($a) != ci_b.mid ($b)" }
          Write-Host "determinism OK: the two renders are byte-identical"

      - name: Download pluginval
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval_Windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory('pluginval_Windows.zip', 'pluginval')

      - name: Validate VST3 (strictness 5)
        # Flags verified against `pluginval --help` (v1.0.4); strictness 5 is
        # also pluginval's default and the minimum recommended for compatibility.
        run: .\pluginval\pluginval.exe --validate "build\src\plugin\HarmonyForge_artefacts\Release\VST3\Harmony Forge.vst3" --strictness-level 5
