# Sprint 4 CI: configure (BUILD_PLUGIN=ON) + build + ctest + pluginval VST3 check.
# Every step below mirrors a command run locally during Sprint 4.
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    # The enforce gates (stdlib only, seconds, no build): fail fast before
    # configure/build/test. Two families, both blocking:
    #  * architecture/isolation — banned tokens on the audio path, the
    #    layer includes, the golden pin, the golden-manifest registry, the
    #    invariant tags, the sealed-split isolation;
    #  * quality/size ratchets (S10.1) — file size, UTF-8 encoding, the
    #    CCN ratchet and the off-golden literal census. These ARE style/
    #    quality gates: they are static, fast and blocking, and every
    #    counter, exception and reason behind them is recorded in
    #    docs/measurements/ratchet.md.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the golden-manifest lint checks that every
          # record's `commit` names a commit that RESOLVES in this
          # repository. A shallow clone (default fetch-depth: 1) cannot
          # resolve it, so the check would be skipped in CI.
          fetch-depth: 0

      - name: Layer gate (src/core JUCE-free, inference plugin-free)
        run: python tools/check_layers.py --strict

      - name: RT gate (no banned tokens in audio-path scope)
        run: python tools/rt_scan.py --strict

      - name: Golden pin lint (frozen bitmap pin, NEVER-REGENERATE)
        run: python tools/lint_golden_pin.py

      - name: "Golden manifest lint (checked registry: schema + sha + coverage)"
        # Stdlib only, seconds, no build: tests/golden_manifest.json must
        # stay a CHECKED registry. What the lint enforces:
        #  - every record carries kind/commit/produced_by/files, the kind
        #    matches its section, and the commit names a commit that
        #    RESOLVES in this repository (skipped, with a NOTE, when the
        #    resolution is unavailable - shallow clone / no git);
        #  - every recorded sha256 equals the file's canonical sha256
        #    (LF-normalized for text artifacts, raw for binary ones);
        #  - every produced_by uses one of two honest, prefix-required
        #    forms: `gen: <command>` (a tool of the lint's WRITER registry,
        #    bound to that exact artifact) or
        #    `capture: <source>@<commit> (no in-repo writer) - <pointer>`
        #    (pointer file + a quoted anchor that appears verbatim in it);
        #  - every file under tests/golden/** + tests/fixtures/** is
        #    registered by some record (except the tool's reasoned exclusion
        #    list), the named test files/cases still exist, and the
        #    golden_midi scalars match their file.
        # Blocking: non-zero fails the job, same shape as the pin lint.
        run: python tools/lint_golden_manifest.py

      - name: Invariant tag lint (named [inv1]-[inv5] bindings)
        # Stdlib only, seconds: every INVARIANTS.md-bound TEST_CASE carries
        # its [invN] tag (tools/lint_inv_tags.py, in-script map). Blocking:
        # non-zero fails the job, same shape as the golden pin lint.
        run: python tools/lint_inv_tags.py

      - name: Sealed-test isolation grep
        # No training/eval code may reference the sealed split. The only
        # legitimate references are the one-time producer
        # (training/ingest/carve_sealed.py: wrote the split at creation,
        # never scores) and the verifier (training/tests/test_sealed.py:
        # manifest cross-checks only). Anything else fails the job.
        run: |
          $hits = Get-ChildItem -Path training -Recurse -Filter *.py | Select-String -Pattern 'sealed_test' | Where-Object { $_.Path -notmatch 'carve_sealed\.py$' -and $_.Path -notmatch 'test_sealed\.py$' }
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'sealed-grep CLEAN: only carve_sealed.py + test_sealed.py reference sealed_test'

      - name: File-size gate (no code file over 500 lines may appear/grow)
        # Stdlib only, seconds: tools/lint_file_size.py pins the 8 code
        # files that are over 500 lines today (tracked .h/.cpp/.py under
        # src/ tests/ tools/). The SET must not GROW (a new file over 500
        # lines fails) and a pinned file's line count must not GROW; a
        # shrunk pinned file is only reported (the owner prunes the list).
        # Line counting is python over the file BYTES — never
        # Measure-Object -Line (it counts non-empty lines only: it said
        # 975 for the 1046-line PluginEditor.cpp, see
        # docs/measurements/s9-0.md Appendix B).
        run: python tools/lint_file_size.py

      - name: UTF-8 gate (every tracked text file decodes as UTF-8)
        # Stdlib only, seconds: tools/lint_utf8.py checks every tracked
        # file except the vendored JUCE/ and external/ trees; a file with
        # a NUL byte is binary and is skipped. Two paths are allowlisted
        # (tools/score_sheet.md — CP1252 by an S0 decision, NEVER
        # re-encode; tests/fixtures/ref_bad_header.mid — a deliberately
        # corrupted MIDI fixture that must not be "fixed"). Blocking:
        # non-zero fails the job.
        run: python tools/lint_utf8.py

      - name: Install the pinned CCN analyzer (lizard 1.24.1)
        # The CCN ratchet measures with lizard 1.24.1 — the version this
        # repo measured with (docs/measurements/s3-0-ccn.md). The version
        # is PINNED on purpose: another lizard version moves the CCN
        # numbers and would silently re-baseline the ratchet.
        run: python -m pip install lizard==1.24.1

      - name: CCN ratchet gate (no new function over CCN 15; ceiling 20)
        # lizard + stdlib, seconds: tools/lint_ccn.py over src/. A new
        # function above CCN 15 fails (16..20 must be pinned with a
        # reason, >20 is the owner's hard ceiling); a pinned function's
        # CCN may not grow; a vanished pinned function is only reported.
        # --strict: a missing lizard fails the job instead of skipping.
        run: python tools/lint_ccn.py --strict

      - name: Off-golden literal census (hard-zero + per-file ratchet)
        # Stdlib only, seconds: tools/lint_off_golden.py. BLOCKING since
        # S10.1: digest64 and hex16+ must be 0 (hard-zero categories),
        # and the per-file counts of vectors/strings/assert>=1000/toler
        # and the TOTAL may not grow — a total-only ratchet would let
        # literals be moved between files. The pins and the audited
        # classification blocks live in tools/off_golden_ratchet.py
        # (16 assert entries, 15 MANUAL_PARITY entries, 43 per-file
        # lines); the record is docs/measurements/ratchet.md.
        run: python tools/lint_off_golden.py

  build-test-validate:
    needs: gates
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Vocab layout check (spec -> gen.h freshness + frozen pin)
        # Stdlib only, seconds: spec-bitmap == frozen d66faabf pin AND
        # committed vocab_layout.gen.h == generator output. Must run BEFORE
        # build so a stale/mismatched generated header fails fast.
        run: python tools/gen_vocab_layout.py --check

      - name: Golden pin lint (frozen bitmap pin, NEVER-REGENERATE)
        # Stdlib only, seconds: canonical bitmap sha == in-script d66faabf
        # pin (tools/lint_golden_pin.py) + manifest frozen/file cross-check.
        # Runs AFTER the vocab check (same gate family) and BEFORE build so
        # a tampered frozen golden fails fast. Blocking: non-zero fails job.
        run: python tools/lint_golden_pin.py

      - name: Invariant tag lint (named [inv1]-[inv5] bindings)
        # Stdlib only, seconds: every INVARIANTS.md-bound TEST_CASE carries
        # its [invN] tag (tools/lint_inv_tags.py). Runs AFTER the golden pin
        # (same gate family) and BEFORE build. Blocking: non-zero fails job.
        run: python tools/lint_inv_tags.py

      - name: Configure
        run: cmake -S . -B build -DHARMONY_FORGE_BUILD_PLUGIN=ON

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: S3 body-identity check (advisory)
        # S3 slice 1: exact-move guard for the candidates.cpp split
        # (tools/check_bodies.py, stdlib only, seconds). ADVISORY until the
        # split lands — never fail the job.
        continue-on-error: true
        run: python tools/check_bodies.py

      - name: Determinism proof (render_midi byte-identity)
        run: |
          .\build\tools\Release\render_midi.exe --seed 7 --bars 4 --out ci_a.mid
          .\build\tools\Release\render_midi.exe --seed 7 --bars 4 --out ci_b.mid
          fc /b ci_a.mid ci_b.mid

      - name: Download pluginval
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval_Windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory('pluginval_Windows.zip', 'pluginval')

      - name: Validate VST3 (strictness 5)
        # Flags verified against `pluginval --help` (v1.0.4); strictness 5 is
        # also pluginval's default and the minimum recommended for compatibility.
        run: .\pluginval\pluginval.exe --validate "build\src\plugin\HarmonyForge_artefacts\Release\VST3\Harmony Forge.vst3" --strictness-level 5
